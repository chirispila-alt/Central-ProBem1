<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProBem - Bolsas</title>
    <link rel="stylesheet" href="tipografia.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .page-title .title-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #efebf7;
            color: #6a5496;
            font-size: var(--fs-xl);
        }

        .page-title h1 {
            margin: 0;
            font-size: var(--fs-2xl);
            color: #2e2250;
        }

        .bolsas-panel {
            background: rgba(255,255,255,.92);
            border: 1px solid #e9e4f2;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(24,70,120,.05);
        }

        .bolsas-panel h2 {
            margin: 0 0 16px;
            color: #2e2250;
            font-size: var(--fs-lg);
        }

        .periods {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .period {
            border: 0;
            border-radius: 28px;
            padding: 11px 25px;
            background: #e6dff2;
            color: #6a5496;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .period:hover {
            transform: translateY(-1px);
            background: #e3dcee;
        }

        .period.selected {
            background: #6a5496;
            color: white;
            box-shadow: 0 5px 12px rgba(106,84,150,.2);
        }

        .divider {
            height: 1px;
            background: #e6e1f0;
            margin: 25px 0;
        }

        .consult-title {
            margin-bottom: 15px !important;
        }

        .consult-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .consult-card {
            border: 1px solid #e6e1f0;
            border-radius: 12px;
            background: white;
            padding: 20px;
            min-height: 185px;
            text-align: left;
            cursor: pointer;
            position: relative;
            transition: .2s;
        }

        .consult-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 22px rgba(27,75,130,.09);
        }

        .consult-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: var(--fs-xl);
            margin-bottom: 15px;
        }

        .consult-card.blue {
            background: linear-gradient(145deg,#faf8fd,#f5f2fa);
        }

        .consult-card.blue .consult-icon {
            background: #e6dff2;
        }

        .consult-card.green {
            background: linear-gradient(145deg,#fbfffd,#effaf5);
        }

        .consult-card.green .consult-icon {
            background: #d4f3e4;
        }

        .consult-card.purple {
            background: linear-gradient(145deg,#fcfbff,#f6f2ff);
        }

        .consult-card.purple .consult-icon {
            background: #e5dcff;
        }

        .consult-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2e2250;
            font-size: var(--fs-lg);
            font-weight: 800;
        }

        .consult-title-row span {
            color: #6a5496;
            font-size: var(--fs-xl);
            font-weight: 400;
        }

        .consult-card p {
            color: #6f559d;
            font-size: var(--fs-sm);
            line-height: 1.55;
            margin: 8px 0 0;
        }

        .period-label {
            margin-top: 8px;
            color: #77609f;
            font-size: var(--fs-xs);
        }

        @media (max-width: 900px) {
            .consult-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="app">

    <aside class="sidebar"></aside>

    <main class="main">

        <header class="topbar">
            <div></div>

            <div class="user">
                <div class="notification">
                    🔔
                    <span>3</span>
                </div>

                <div class="avatar">JS</div>
                <strong>João Silva</strong>
                <span class="arrow">⌄</span>
            </div>
        </header>

        <section class="content">

            <div class="page-title">
                <div class="title-icon">🎓</div>
                <h1>Bolsas</h1>
            </div>

            <section class="bolsas-panel">

                <h2>Sobre qual benefício quer tratar?</h2>

                <div class="periods">
                    <button class="period" data-period="2020-1">2020-1</button>
                    <button class="period" data-period="2020-2">2020-2</button>
                    <button class="period" data-period="2021-1">2021-1</button>
                    <button class="period" data-period="2021-2">2021-2</button>
                </div>

                <div class="period-label">
                    Benefício selecionado: <strong id="selectedPeriod"></strong>
                </div>

                <div class="divider"></div>

                <h2 class="consult-title">O que você deseja consultar?</h2>

                <div class="consult-cards">

                    <button class="consult-card blue" data-section="Notificações">
                        <div class="consult-icon">🔔</div>

                        <div class="consult-title-row">
                            Notificações
                            <span>›</span>
                        </div>

                        <p>
                            Acompanhe comunicados, status e
                            atualizações sobre sua bolsa.
                        </p>
                    </button>

                    <button class="consult-card green" data-section="Requerimentos">
                        <div class="consult-icon">📄</div>

                        <div class="consult-title-row">
                            Requerimentos
                            <span>›</span>
                        </div>

                        <p>
                            Consulte e envie documentos
                            necessários para sua bolsa.
                        </p>
                    </button>

                    <button class="consult-card purple" data-section="Valor">
                        <div class="consult-icon">💲</div>

                        <div class="consult-title-row">
                            Valor
                            <span>›</span>
                        </div>

                        <p>
                            Verifique o valor da sua bolsa
                            e o histórico de pagamentos.
                        </p>
                    </button>

                </div>

            </section>

        </section>

    </main>
</div>

<script>
    const periods = document.querySelectorAll(".period");
    const selectedPeriod = document.getElementById("selectedPeriod");

    periods.forEach(button => {
        button.addEventListener("click", () => {
            periods.forEach(item => item.classList.remove("selected"));
            button.classList.add("selected");
            selectedPeriod.textContent = button.dataset.period;
        });
    });

    const cards = document.querySelectorAll(".consult-card");

    cards.forEach(card => {
        card.addEventListener("click", () => {
            const section = card.dataset.section;
            const period = selectedPeriod.textContent;

            alert(
                "Consulta selecionada: " +
                section +
                "\\nPeríodo: " +
                period
            );
        });
    });
</script>

    <script src="menu.js"></script>
</body>
</html>
